<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Calm Space">
  <defs>
    <linearGradient id="wash" x1="6%" y1="94%" x2="94%" y2="6%">
      <stop offset="0%" stop-color="#14d4c8"/>
      <stop offset="34%" stop-color="#4f74f7"/>
      <stop offset="66%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#fb6fb0"/>
    </linearGradient>
    <radialGradient id="lift" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#0b1020" stop-opacity=".16"/>
    </radialGradient>
    <radialGradient id="core" cx="40%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff6e0"/>
      <stop offset="100%" stop-color="#ffd9a0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#wash)"/>
  <rect width="512" height="512" fill="url(#lift)"/>
  <!-- Two bold rings only (safe zone: outer edge ≈ 186 from centre) -->
  <circle cx="256" cy="256" r="166" fill="none" stroke="#fff7ea" stroke-width="36" stroke-linecap="round" opacity=".58"/>
  <circle cx="256" cy="256" r="108" fill="none" stroke="#fffaf2" stroke-width="40" stroke-linecap="round" opacity=".95"/>
  <!-- Cream core + soft glow (not a third ring) -->
  <circle cx="256" cy="256" r="48" fill="url(#core)" filter="url(#glow)"/>
</svg>
